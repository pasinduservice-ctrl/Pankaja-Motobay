<!DOCTYPE html>

<html>

<head>

    <title>Pankaja Motobay Admin</title>

    <link
        rel="stylesheet"
        href="./admin.css">

</head>

<body>

    <div class="login-box">

        <h1>Admin Login</h1>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="error"></p>

    </div>


    <script src="./login.js"></script>

</body>

</html>
