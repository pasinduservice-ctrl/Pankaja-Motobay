[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/login.html"
  status = 301

[[redirects]]
  from = "/admin/"
  to = "/admin/login.html"
  status = 301
